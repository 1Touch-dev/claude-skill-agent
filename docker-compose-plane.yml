# Plane CE — Project Management layer
# Start: docker compose -f docker-compose-plane.yml up -d
# Plane UI:  http://54.167.31.169:8083
# Plane API: http://54.167.31.169:8083/api/v1/
#
# Service names match Plane's Caddy proxy expectations:
#   web:3000, space:3000, admin:3000, live:3000, api:8000

x-app-env: &app-env
  SECRET_KEY: ${PLANE_SECRET_KEY:-please-change-me-plane-secret-key-256}
  DJANGO_SETTINGS_MODULE: plane.settings.production
  DATABASE_URL: postgresql://plane:plane@plane-db:5432/plane
  REDIS_URL: redis://plane-redis:6379/
  # Plane uses RabbitMQ as its Celery broker
  AMQP_URL: amqp://plane:plane@plane-mq:5672/plane
  WEB_URL: http://localhost:8083
  CORS_ALLOWED_ORIGINS: "http://54.167.31.169:3001,http://localhost:3001,http://54.167.31.169:8083,http://localhost:8083,http://54.167.31.169:3000,http://localhost:3000"
  DEBUG: "0"
  DOCKERIZED: "1"
  USE_MINIO: "1"
  AWS_REGION: ""
  AWS_ACCESS_KEY_ID: access-key
  AWS_SECRET_ACCESS_KEY: secret-key
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  AWS_S3_BUCKET_NAME: uploads
  FILE_SIZE_LIMIT: "5242880"
  DEFAULT_EMAIL: ${PLANE_ADMIN_EMAIL:-admin@planepmsystem.local}
  DEFAULT_PASSWORD: ${PLANE_ADMIN_PASSWORD:-Plane@Admin2026}
  SIGNUP_DISABLED: "0"
  EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"
  EMAIL_HOST: ""
  EMAIL_PORT: "587"
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
  EMAIL_USE_TLS: "1"
  EMAIL_FROM: "noreply@planepmsystem.local"
  ENABLE_MAGIC_LINK_LOGIN: "0"
  ENABLE_EMAIL_PASSWORD: "1"
  GOOGLE_CLIENT_ID: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  GUNICORN_WORKERS: "2"
  PORT: "8000"
  LIVE_SERVER_SECRET_KEY: "2FiJk1U2aiVPEQtzLehYGlTSnTnrs7LW"
  WEBHOOK_ALLOWED_IPS: "0.0.0.0/0"
  WEBHOOK_ALLOWED_HOSTS: "backend,localhost,127.0.0.1,54.167.31.169,claude-skill-agent-backend-1"

services:
  # ── DB migrations (runs once, then exits) ─────────────────────────────────
  plane-migrator:
    image: makeplane/plane-backend:stable
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    environment:
      <<: *app-env
    depends_on:
      plane-db:
        condition: service_healthy
    networks:
      - plane-net

  # ── Backend API (service named 'api' for Caddy) ────────────────────────────
  api:
    image: makeplane/plane-backend:stable
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    environment:
      <<: *app-env
    depends_on:
      plane-migrator:
        condition: service_completed_successfully
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_started
      plane-mq:
        condition: service_healthy
      plane-minio:
        condition: service_started
    networks:
      - plane-net
    volumes:
      - plane-logs:/app/logs

  # ── Celery worker ─────────────────────────────────────────────────────────
  plane-worker:
    image: makeplane/plane-backend:stable
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    environment:
      <<: *app-env
    depends_on:
      - api
    networks:
      - plane-net

  # ── Celery beat ───────────────────────────────────────────────────────────
  plane-beat-worker:
    image: makeplane/plane-backend:stable
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    environment:
      <<: *app-env
    depends_on:
      - api
    networks:
      - plane-net

  # ── Live collaboration server ─────────────────────────────────────────────
  live:
    image: makeplane/plane-live:stable
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      LIVE_SERVER_SECRET_KEY: "2FiJk1U2aiVPEQtzLehYGlTSnTnrs7LW"
      REDIS_HOST: plane-redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://plane-redis:6379/
    depends_on:
      - api
    networks:
      - plane-net

  # ── Frontend (nginx on :3000) — served at /* ──────────────────────────────
  web:
    image: makeplane/plane-frontend:stable
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - plane-net

  # ── Spaces frontend (Node.js on :3000) — served at /spaces/* ─────────────
  space:
    image: makeplane/plane-space:stable
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - plane-net

  # ── Admin / God-mode frontend (nginx on :3000) — served at /god-mode/* ───
  admin:
    image: makeplane/plane-admin:stable
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - plane-net

  # ── Caddy reverse proxy (:8083 → all services) ───────────────────────────
  plane-proxy:
    image: makeplane/plane-proxy:stable
    restart: unless-stopped
    ports:
      - "8083:80"
    environment:
      FILE_SIZE_LIMIT: "5242880"
      BUCKET_NAME: uploads
      SITE_ADDRESS: ":80"
      CERT_EMAIL: ""
      TRUSTED_PROXIES: "0.0.0.0/0"
    depends_on:
      - web
      - api
      - space
      - admin
      - live
      - plane-minio
    networks:
      - plane-net

  # ── Infrastructure ────────────────────────────────────────────────────────
  plane-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: plane
      POSTGRES_DB: plane
    volumes:
      - plane-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plane -d plane"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plane-net

  plane-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - plane-redis-data:/data
    networks:
      - plane-net

  # RabbitMQ — Plane's official Celery broker
  plane-mq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: plane
      RABBITMQ_DEFAULT_PASS: plane
      RABBITMQ_DEFAULT_VHOST: plane
    volumes:
      - plane-mq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - plane-net

  plane-minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: access-key
      MINIO_ROOT_PASSWORD: secret-key
    volumes:
      - plane-minio-data:/data
    networks:
      - plane-net

  plane-minio-createbuckets:
    image: minio/mc
    depends_on:
      - plane-minio
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        /usr/bin/mc alias set minio http://plane-minio:9000 access-key secret-key;
        /usr/bin/mc mb minio/uploads --ignore-existing;
        /usr/bin/mc policy set download minio/uploads;
        exit 0;
      "
    networks:
      - plane-net

networks:
  plane-net:
    driver: bridge

volumes:
  plane-pgdata:
  plane-redis-data:
  plane-mq-data:
  plane-minio-data:
  plane-logs:
