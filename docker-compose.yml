version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=enterprise_claude_skills
    depends_on:
      - postgres
      - redis
  frontend:
    build: ./frontend
    ports:
      - "3001:3000"
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterprise_claude_skills
    ports:
      - "5432:5432"
  redis:
    image: redis:6
    ports:
      - "6379:6379"