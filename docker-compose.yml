version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=enterprise_claude_skills
      - REDIS_URL=redis://redis:6379
      - ADMIN_TOKEN=changeme
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GH_TOKEN=${GH_TOKEN}
    depends_on:
      - postgres
      - redis
  frontend:
    build: ./frontend
    ports:
      - "3001:3000"
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterprise_claude_skills
    ports:
      - "5432:5432"
  redis:
    image: redis:6
    ports:
      - "6379:6379"