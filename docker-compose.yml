# Runs on EC2 independently of your laptop/Cursor session.
# restart: unless-stopped keeps the site up after reboots and crashes.
services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=enterprise_claude_skills
      - REDIS_URL=redis://redis:6379
      - ADMIN_TOKEN=${ADMIN_TOKEN:-changeme}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GH_TOKEN=${GH_TOKEN}
    depends_on:
      - postgres
      - redis
    networks:
      - default
      - plane-net
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - REACT_APP_API_BASE=${PUBLIC_API_URL:-http://54.167.31.169:3000}
      - REACT_APP_API_PORT=${API_PORT:-3000}
      - PORT=3001
      - HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
  postgres:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterprise_claude_skills
    ports:
      - "5432:5432"
  redis:
    image: redis:6
    restart: unless-stopped
    ports:
      - "6379:6379"

networks:
  default: {}
  plane-net:
    external: true
    name: claude-skill-agent_plane-net